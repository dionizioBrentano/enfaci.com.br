<!-- @dsCard height=288 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  .en-cover { position: relative; width: 960px; height: 288px; background: var(--surface); overflow: hidden; }
  .en-cover svg { position: absolute; inset: 0; }
  .en-cover .accent      { fill: var(--accent); }
  .en-cover .accent-light{ fill: var(--accent-light); }
  .en-cover .gold        { fill: var(--gold); }
  .en-cover .alt         { fill: var(--surface-alt); }
  .en-cover .mark        { fill: var(--brand-mark); }
  .en-cover .ground      { fill: var(--surface); }
  .en-cover .tile        { rx: var(--radius-md); }
  .en-cover .text {
    position: absolute; left: 48px; bottom: 44px; width: 440px;
  }
  .en-cover .name {
    font-family: var(--font-display); font-weight: 700; font-size: 104px;
    line-height: .92; letter-spacing: -.03em; color: var(--ink); margin: 0;
  }
  .en-cover .tag {
    font-family: var(--font-sans); font-size: 13px; font-weight: 700;
    letter-spacing: .04em; color: var(--text-muted); margin: 16px 0 0;
  }
</style>
<div class="en-cover">
  <!-- Blocos: accent (laje 220×288, sangra em cima e embaixo) · gold tile 120×144 · accent-light 108×144 (sangra à direita) · surface-alt 244×96 (sangra embaixo) · traço mark 220×12.
       Arranjo: uma laje alta com satélites à direita, do x=480 à borda — a faixa verde de autoridade do site com os acentos ao lado.
       Padrão: faixas horizontais recortadas dos blocos, porque o wordmark ENFACI é literalmente construído de barras horizontais com fendas; um sistema genérico não chegaria a esta figura.
       Escalas: pitch 44px e 32px (space-6 + space-5 / space-8), fendas de 12px (space-3), cantos radius-md 8px. -->
  <svg viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect class="accent" x="480" y="0" width="220" height="288"/>
    <rect class="gold"   x="512" y="56"  width="156" height="12"/>
    <rect class="gold"   x="512" y="100" width="156" height="12"/>
    <rect class="gold"   x="512" y="144" width="100" height="12"/>
    <rect class="gold"   x="512" y="188" width="156" height="12"/>
    <rect class="gold"   x="512" y="232" width="156" height="12"/>

    <rect class="gold tile"         x="716" y="32"  width="120" height="144"/>
    <rect class="ground"            x="740" y="72"  width="72"  height="12"/>
    <rect class="ground"            x="740" y="104" width="72"  height="12"/>

    <rect class="accent-light tile" x="852" y="32"  width="108" height="144"/>
    <rect class="gold"              x="876" y="72"  width="60"  height="12"/>

    <rect class="alt"               x="716" y="192" width="244" height="96"/>
    <rect class="mark"              x="740" y="224" width="196" height="12"/>
    <rect class="mark"              x="740" y="256" width="124" height="12"/>
  </svg>
  <div class="text">
    <p class="name">Enfaci</p>
    <p class="tag">Enfermagem Assistencial de Cuidado Integral</p>
  </div>
</div>
