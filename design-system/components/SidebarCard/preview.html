<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<div class="en-root" style="padding:28px;display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:24px;align-items:start">
  <section class="sidebar-card">
    <h3 class="sidebar-card-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      Cobertura por CEP
    </h3>
    <div class="sidebar-card-body">
      <div class="field">
        <label class="field-label" for="cep-demo">CEP do atendimento</label>
        <input class="field-input" id="cep-demo" inputmode="numeric" placeholder="00000-000">
        <span class="field-hint">Usamos o CEP só para verificar quais profissionais atendem na região.</span>
      </div>
      <a href="#" class="btn-primary" style="margin-top:14px;width:100%;text-align:center">Verificar disponibilidade</a>
    </div>
  </section>

  <section class="wa-card">
    <span class="wa-icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.3-1.4A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3.1.8.8-3-.2-.3A8 8 0 1 1 12 20Z"/></svg>
    </span>
    <h3 class="wa-title">Precisa de atendimento hoje?</h3>
    <p class="wa-text">Fale com a equipe de enfermagem e confirme o turno disponível na sua região.</p>
    <a href="#" class="wa-btn">Falar no WhatsApp</a>
  </section>
</div>
