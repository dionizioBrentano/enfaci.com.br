<!-- @dsCard group="Navegação" height=560 subtitle="Folha deslizante de agendamento, com escolha de turno" -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  .phone-tall {
    width: 390px; height: 520px; margin: 0 auto; position: relative;
    border: 1px solid var(--hairline-strong); border-radius: 24px;
    overflow: hidden; background: var(--surface);
  }
  .phone-tall .sheet, .phone-tall .sheet-backdrop { position: absolute; }
  .phone-tall .sheet { transform: none; }
</style>
<div class="en-root">
  <div class="phone-tall">
    <div class="sheet-backdrop is-open"></div>
    <section class="sheet is-open" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
      <span class="sheet-grabber" aria-hidden="true"></span>
      <div class="sheet-header">
        <h2 class="sheet-title" id="sheet-t">Agendar atendimento</h2>
        <p class="sheet-sub">Administração de Medicamentos por Via Intramuscular</p>
      </div>
      <div class="sheet-body">
        <div class="field" style="margin-bottom:20px">
          <label class="field-label" for="s-cep">CEP do atendimento</label>
          <input class="field-input" id="s-cep" inputmode="numeric" value="91520-000">
          <span class="field-hint">3 profissionais atendem nesta região.</span>
        </div>

        <div class="field" style="margin-bottom:20px">
          <label class="field-label" for="s-data">Data</label>
          <input class="field-input" id="s-data" value="24/09/2026">
        </div>

        <span class="field-label" style="display:block;margin-bottom:8px">Turno</span>
        <div class="slot-group" role="group" aria-label="Escolha o turno">
          <button type="button" class="slot-option" aria-pressed="false">
            <span class="slot-option-name">Manhã</span>
            <span class="slot-option-time">7h–12h</span>
          </button>
          <button type="button" class="slot-option" aria-pressed="true">
            <span class="slot-option-name">Tarde</span>
            <span class="slot-option-time">12h–18h</span>
          </button>
          <button type="button" class="slot-option" aria-pressed="false">
            <span class="slot-option-name">Noite</span>
            <span class="slot-option-time">18h–22h</span>
          </button>
        </div>
      </div>
      <div class="sheet-footer">
        <button type="button" class="btn-gold">Confirmar solicitação</button>
      </div>
    </section>
  </div>
</div>
